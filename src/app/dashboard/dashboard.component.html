<main class="dashboard">
  <button class="music-toggle" type="button" [class.muted]="musicMuted" (click)="toggleMusic()" [attr.aria-label]="musicMuted ? 'Turn music on' : 'Mute music'">
    <span class="speaker-icon" aria-hidden="true"><i></i></span>
    <small>{{ musicMuted ? 'Music off' : 'Music on' }}</small>
  </button>
  <div class="cloud cloud-one"></div>
  <div class="cloud cloud-two"></div>
  <header class="dashboard-header">
    <span class="eyebrow">LEARN &bull; PLAY &bull; GROW</span>
    <h1>Alphabet Adventure</h1>
    <p>Pick a game and start learning your ABCs!</p>
  </header>

  <div class="game-carousel">
    <button
      class="carousel-arrow previous"
      type="button"
      (click)="slideGames(-1)"
      aria-label="Show previous games"
    >
      <span class="arrow-icon">&#x276E;</span><small>Back</small>
    </button>

    <div class="game-viewport">
      <section #gameTrack class="game-grid" aria-label="Choose a game">
        <button class="game-tile letter-tile" routerLink="/alphabet-sounds">
          <span class="tile-art card-picture"
            ><img
              src="assets/image/game-cards/alphabet-sounds.png"
              alt="Happy A, B and C characters"
          /></span>
          <span class="tile-copy"
            ><strong>Alphabet Sounds</strong
            ><small>Press a letter, hear its sound</small></span
          >
          <span class="play-pill">Play now <span>&rarr;</span></span>
        </button>

        <button class="game-tile car-tile" routerLink="/alphabet-car">
          <span class="tile-art card-picture"
            ><img
              src="assets/image/game-cards/alphabet-car.png"
              alt="Friendly red alphabet car"
              loading="lazy"
          /></span>
          <span class="tile-copy"
            ><strong>Alphabet Car</strong
            ><small>Drive your car through the ABCs</small></span
          >
          <span class="play-pill">Start engine <span>&rarr;</span></span>
        </button>

        <button class="game-tile snake-tile" routerLink="/alphabet-snake">
          <span class="tile-art card-picture"
            ><img
              src="assets/image/game-cards/alphabet-snake.png"
              alt="Friendly alphabet snake in a colorful picture garden"
              loading="lazy"
          /></span>
          <span class="tile-copy"
            ><strong>Alphabet Snake</strong
            ><small
              >Press a letter and find a picture and feed the snake</small
            ></span
          >
          <span class="play-pill">Start slithering <span>&rarr;</span></span>
        </button>

        <div class="game-tile coming-tile" aria-disabled="true">
          <span class="soon-badge">COMING SOON</span
          ><span class="tile-art card-picture"
            ><img
              src="assets/image/game-cards/alphabet-mystery.png"
              alt="Magical mystery treasure chest"
              loading="lazy"
          /></span>
          <span class="tile-copy"
            ><strong>Alphabet Mystery</strong
            ><small>A new adventure is on the way!</small></span
          >
          <span class="locked-pill">&#x1F512; Locked</span>
        </div>
      </section>
    </div>

    <button
      class="carousel-arrow next"
      type="button"
      (click)="slideGames(1)"
      aria-label="Show next games"
    >
      <span class="arrow-icon">&#x276F;</span><small>Next</small>
    </button>
  </div>
  <p class="swipe-hint"><span class="hint-chevron left" aria-hidden="true"></span>Choose an adventure<span class="hint-chevron right" aria-hidden="true"></span></p>
</main>
